[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bro"
version = "0.1.0"
description = "AI assistant for lazy people."
authors = [
    { name = "Cyan Ding", email = "blueplus.d@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright",
    "patchright",
    "python-dotenv",
    "aiohttp",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.12.0",
    "pre-commit>=3.5.0",
    "pydantic>=2.10.6",
    "cerebras-cloud-sdk>=1.35.0",
    "opencv-python",
    "ultralytics",
    "numpy",
    "Pillow",
    "tqdm",
    "scipy",
    "matplotlib",
    "pytz",
    "pandas",
    "requests",
    "scikit-learn",
    "typing-extensions",
    "beautifulsoup4",
    "anthropic>=0.56.0",
    "openai>=1.93.0",
    "lxml",
    "chardet",
    "datasets>=3.6.0",
    "label-studio>=1.20.0",
    "transformers>=4.53.1",
    "peft>=0.16.0",
    "nltk>=3.9.1",
    "rouge-score>=0.1.2",
    "coreml>=0.0.4",
    "deptry>=0.23.0",
    "optimum>=1.26.1",
    "coremltools>=8.3.0",
    "onnx-coreml>=1.3",
    "pyvips>=3.0.0",
    "pyvips-binary>=8.17.1",
    "einops>=0.8.1",
    "trafilatura>=1.6.1",
]

[tool.setuptools.packages.find]
where = ["bro"]
